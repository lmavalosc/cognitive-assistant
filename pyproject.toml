[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-assistant"
version = "0.1.0"
description = "Núcleo Transaccional del Asistente Cognitivo - Etapa 1: Tronco Encefálico"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Moisés", email = "moises@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    "langgraph>=0.2.0",
    "mem0ai>=0.1.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "firecrawl-py>=1.0.0",
    "playwright>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_assistant"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
